name: Image preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "codex-rs/tui/**"
      - ".github/workflows/image-preview.yml"
  push:
    branches:
      - feat/terminal-image-preview

permissions:
  contents: read

concurrency:
  group: image-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_MIN_STACK: "8388608"
  FORCE_COLOR: "0"

jobs:
  preview-tests:
    name: Image preview tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: codex-rs
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev libasound2-dev bubblewrap cmake ninja-build

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Use the repository's pinned Rust toolchain
        # Running Cargo here lets rustup install codex-rs/rust-toolchain.toml automatically.
        run: cargo --version

      - name: Cache Cargo dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: image-preview-deps-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}
          restore-keys: |
            image-preview-deps-${{ runner.os }}-

      - name: Test image preview rendering and gallery
        run: cargo test --locked -p codex-tui --lib image_preview

      - name: Test image slash command
        run: cargo test --locked -p codex-tui --lib image_command

      - name: Test transcript layout and fallback previews
        run: cargo test --locked -p codex-tui --lib transcript_view

      - name: Test terminal image cleanup
        run: cargo test --locked -p codex-tui --lib custom_terminal

      - name: Test terminal probes and input preservation
        run: cargo test --locked -p codex-tui --lib terminal_probe

      - name: Test terminal resize policy
        run: cargo test --locked -p codex-tui --lib tui::screen_size

      - name: Test side conversation command availability
        run: cargo test --locked -p codex-tui --lib side_conversation_hides_commands_without_side_flag
